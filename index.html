  :root {

  /* Header */

  .logo {
    width: 96px; height: 96px; border-radius: 50%; display: block; margin: 0 auto 14px;

  h1 { font-size: 40px; font-weight: 800; letter-spacing: -1.2px; line-height: 1.05; }
  .tag { font-size: 17px; color: var(--ink2); margin: 8px auto 0; max-width: 380px; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 16px 0 4px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; border-radius: 999px;
    background: var(--surface); box-shadow: var(--card); font-size: 13px; font-weight: 700; color: var(--ink2);
  }
  .chip svg { width: 15px; height: 15px; color: var(--primary); }

  /* Actions */
  .actions { margin-top: 22px; display: grid; gap: 10px; }
  .btn {
    display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px 18px; border-radius: 18px;
    text-decoration: none; text-align: left; transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:active { transform: scale(.98); }
  .btn .ic { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; flex: none; }
  .btn .ic svg { width: 24px; height: 24px; }
  .btn b { display: block; font-size: 18px; font-weight: 800; line-height: 1.25; }
  .btn small { display: block; font-size: 13px; font-weight: 600; margin-top: 2px; }
  .btn.dl { background: var(--primary); color: #fff; box-shadow: 0 10px 24px rgba(21, 128, 61, .28); }
  .btn.dl .ic { background: rgba(255, 255, 255, .18); }
  .btn.dl small { color: rgba(255, 255, 255, .85); }
  .btn.web { background: var(--surface); color: var(--ink); box-shadow: var(--card); }
  .btn.web .ic { background: var(--info-soft); color: var(--info); }
  .btn.web small { color: var(--ink3); }
  .btn.ios-first { order: -1; }
  .status { text-align: center; font-size: 14px; font-weight: 700; color: var(--primary); }

  /* Desktop: scan with a phone */
  .scan {
    display: none; margin-top: 14px; padding: 16px; border-radius: 18px; background: var(--surface);
    box-shadow: var(--card); align-items: center; gap: 16px;
  }
  .scan .qr { width: 108px; height: 108px; flex: none; padding: 6px; border-radius: 12px; background: #fff; border: 1px solid var(--border); }
  .scan .qr svg { width: 100%; height: 100%; display: block; }
  .scan b { display: block; font-size: 16px; font-weight: 800; }
  .scan span { font-size: 14px; color: var(--ink2); }
  .desktop .scan { display: flex; }

  /* Screenshots */
  .shots { margin: 30px 0 6px; }
  .shots h2, section h2 { font-size: 17px; font-weight: 700; margin: 0 0 10px; }
  .shots h2 { padding: 0 16px; max-width: 520px; margin-left: auto; margin-right: auto; }
  .rail {
    display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 6px 16px 14px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .rail::-webkit-scrollbar { display: none; }
  figure { flex: none; width: 62%; max-width: 230px; scroll-snap-align: center; text-align: center; }
  figure .phone {
    border-radius: 26px; overflow: hidden; background: var(--surface); aspect-ratio: 540 / 1169;
    box-shadow: 0 0 0 6px #fff, 0 0 0 7px var(--border), var(--raised);
  }
  figure img { width: 100%; height: 100%; display: block; object-fit: cover; }
  figcaption { margin-top: 12px; font-size: 14px; font-weight: 700; color: var(--ink2); }
  @media (min-width: 760px) {
    .rail { justify-content: center; overflow: visible; max-width: 1000px; margin: 0 auto; }
    figure { width: 210px; }
  }

  /* Cards */
  section { margin-top: 22px; }
  .card { background: var(--surface); border-radius: 22px; box-shadow: var(--card); overflow: hidden; }
  .row { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; }
  .row + .row { border-top: 1px solid var(--border); }
  .badge { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; }
  .badge svg { width: 21px; height: 21px; }
  .g { background: var(--primary-soft); color: var(--primary); }
  .a { background: var(--warning-soft); color: var(--warning); }
  .b { background: var(--info-soft); color: var(--info); }
  .r { background: var(--danger-soft); color: var(--danger); }
  .row b { display: block; font-size: 15px; font-weight: 700; }
  .row span { display: block; font-size: 14px; color: var(--ink2); }
  .row a { color: var(--primary); font-weight: 700; text-decoration: none; }
  ol.steps { list-style: none; counter-reset: s; }
  ol.steps li { counter-increment: s; display: flex; gap: 14px; align-items: flex-start; padding: 13px 16px; font-size: 15px; }
  ol.steps li + li { border-top: 1px solid var(--border); }
  ol.steps li::before {
    content: counter(s); width: 28px; height: 28px; border-radius: 9px; flex: none; display: grid; place-items: center;
    background: var(--primary-soft); color: var(--primary-dark); font-weight: 800; font-size: 14px;
  }
  .note { margin-top: 10px; padding: 13px 16px; border-radius: 16px; background: var(--warning-soft); font-size: 14px; color: #713F12; }
  .note b { color: var(--ink); }

  /* Language + footer */
  .lang { display: flex; justify-content: center; gap: 6px; margin: 28px 0 0; }
  .lang button {
    border: 0; background: var(--surface); box-shadow: var(--card); border-radius: 999px; padding: 9px 14px;
    font: inherit; font-size: 14px; font-weight: 700; color: var(--ink2); cursor: pointer;
  }
  .lang button.on { background: var(--primary-soft); color: var(--primary-dark); box-shadow: inset 0 0 0 1.5px var(--primary); }
  footer { text-align: center; font-size: 13px; color: var(--ink3); padding: 20px 0 36px; line-height: 1.6; }
  footer a { color: var(--ink2); font-weight: 700; }
  .hide { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .logo { animation: none; } .btn { transition: none; } }

    safeT: "Is it safe?",
    s1T: "Open source", s1: "All of the app's code is public, so anyone can check it: <a href=\"https://github.com/ZedRubilan/agrozen\">GitHub</a>.",
    s2T: "No sign-up, no ads", s2: "No account, phone number or payment needed.",
    s3T: "A student project", s3: "Built by NamSTU students for StudEXPO-2026. It never prescribes medicines or doses — for sick birds it points you to the district vet.",
    permT: "What the app asks for",
    p1T: "Location", p1: "To show your district's weather and vet.",
    p2T: "Microphone", p2: "To ask a question by voice.",
    p3T: "Phone calls", p3: "To call the district vet with one tap.",
    p4T: "Notifications", p4: "For a daily reminder. You can say no to any of these.",
    starting: "Download started…", updated: "updated",
    authors: "Authors: Salimbek Zamalitdinov, Ulugbek Kodirov · NamSTU",
    credits: "Photos in the app: Wikimedia Commons (licences listed in the app)",
  },
};

let lang = (navigator.language || "uz").slice(0, 2);
if (!T[lang]) lang = "uz";
try { lang = localStorage.getItem("agrozen-lang") || lang; } catch (e) {}
let release = null;

function meta() {
  const t = T[lang];
  if (!release) return t.dlSub;
  const mb = Math.round(release.size / 1048576);
  const d = new Date(release.date);
  // Browsers format Uzbek dates inconsistently, so spell the month out.
  const uzMonths = ["yanvar", "fevral", "mart", "aprel", "may", "iyun", "iyul", "avgust", "sentabr", "oktabr", "noyabr", "dekabr"];
  const date = lang === "uz"
    ? `${d.getDate()}-${uzMonths[d.getMonth()]}`
    : d.toLocaleDateString(lang === "ru" ? "ru-RU" : "en-GB", { day: "numeric", month: "short" });
  return `${release.tag} · ${mb} MB · ${t.updated} ${date}`;
}

function apply() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((e) => (e.textContent = t[e.dataset.t]));
  document.querySelectorAll("[data-h]").forEach((e) => (e.innerHTML = t[e.dataset.h]));
  document.querySelectorAll("[data-l]").forEach((b) => b.classList.toggle("on", b.dataset.l === lang));
  document.querySelectorAll("[data-shot]").forEach((img) => {
    img.src = `shots/${lang}-${img.dataset.shot}.webp`;
    img.alt = img.closest("figure").querySelector("figcaption").textContent;
  });
  document.getElementById("meta").textContent = meta();
}
document.querySelectorAll("[data-l]").forEach((b) => b.addEventListener("click", () => {
  lang = b.dataset.l;
  try { localStorage.setItem("agrozen-lang", lang); } catch (e) {}
  apply();
}));
apply();

// Version, size and date of the newest APK; the button keeps working without them.
fetch(`https://api.github.com/repos/${REPO}/releases/latest`)
  .then((r) => (r.ok ? r.json() : null))
  .then((j) => {
    const apk = j && (j.assets || []).find((a) => a.name.endsWith(".apk"));
    if (!apk) return;
    release = { tag: j.tag_name, size: apk.size, date: j.published_at };
    document.getElementById("dl").href = apk.browser_download_url;
    apply();
  })
  .catch(() => {});

const ua = navigator.userAgent;
const android = /Android/i.test(ua);
const ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
if (ios) {
  // iPhones can't install APKs: the web app is the main action.
  document.getElementById("dl").classList.add("hide");
  document.getElementById("howto").classList.add("hide");
  document.getElementById("web").classList.add("ios-first");
} else if (!android && matchMedia("(min-width: 760px)").matches) {
  // On a computer, offer this page as a QR code to open on a phone.
  document.body.classList.add("desktop");
  try {
    const qr = qrcode(0, "M");
    qr.addData(location.href.split("#")[0]);
    qr.make();
    document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    document.querySelector("#qr path").setAttribute("fill", "#14532D");
  } catch (e) {
    document.body.classList.remove("desktop");
  }
}
document.getElementById("dl").addEventListener("click", () => {
  document.getElementById("status").textContent = T[lang].starting;
});
</script>
</body>
</html>
