name: agrozen
description: "AgroZen — AI-powered assistant for beginner poultry farmers in Uzbekistan"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.8.0

  # State Management
  flutter_bloc: ^8.1.0
  equatable: ^2.0.0

  # Navigation
  go_router: ^14.0.0

  # Localization
  intl: ^0.20.0

  # Data Serialization
  json_annotation: ^4.9.0

  # Notifications (daily plan reminders)
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.0

  # Voice input (Uzbek/Russian speech-to-text via transcribe-voice edge fn)
  record: ^7.0.0
  permission_handler: ^12.0.0

  # Open phone dialer for the veterinarian call button and the video links
  url_launcher: ^6.3.0

  # UI Utilities
  flutter_markdown: ^0.7.0
  google_fonts: ^6.2.0
  share_plus: ^10.0.0

  # Utilities
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0
  image_picker: ^1.2.4
  flutter_tts: ^4.2.5
  http: ^1.6.0
  web: ^1.0.0

  # Bank report: the on-screen report is rendered to an image and wrapped
  # in a one-page A4 PDF, so Cyrillic and the app's fonts come out as shown.
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.0
  mocktail: ^1.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.8.0
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true

  # Cyrillic fallback (Noto Sans, Cyrillic letters only, SIL OFL 1.1 — see
  # assets/fonts/NotoSans-OFL.txt). Plus Jakarta Sans has no basic Cyrillic,
  # so without this Russian text waits for a font download on web and uses
  # whatever the phone has offline.
  fonts:
    - family: NotoSansCyrillic
      fonts:
        - asset: assets/fonts/NotoSansCyrillic-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansCyrillic-500.ttf
          weight: 500
        - asset: assets/fonts/NotoSansCyrillic-600.ttf
          weight: 600
        - asset: assets/fonts/NotoSansCyrillic-700.ttf
          weight: 700
        - asset: assets/fonts/NotoSansCyrillic-800.ttf
          weight: 800

  assets:
    - assets/images/
    - knowledge/
    - knowledge/broilers/en/
    - knowledge/broilers/ru/
    - knowledge/broilers/uz/
    - knowledge/course/en/
    - knowledge/course/ru/
    - knowledge/course/uz/
